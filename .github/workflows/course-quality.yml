name: Качество курса

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: course-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Установить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Установить uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.4"
          enable-cache: true
      - name: Проверить lock-файл
        run: uv lock --check
      - name: Установить зависимости
        run: uv sync --frozen
      - name: Проверить спецификацию и репозиторий
        run: make validate
      - name: Запустить тесты качества
        run: make test
      - name: Проверить код валидаторов
        run: uv run ruff check scripts tests
      - name: Собрать документацию
        run: make docs

  starter-projects:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        starter:
          - M1-architecture-starter
          - M2-databases-starter
          - M3-advanced-git-starter
          - M4-python-tooling-starter
          - M5-numpy-knn-starter
          - M6-pandas-eda-starter
          - M7-fastapi-starter
          - M8-docker-starter
    defaults:
      run:
        working-directory: assignments/${{ matrix.starter }}
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Установить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Установить uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.8.4"
          enable-cache: true
      - name: Проверить lock-файл и публичные тесты
        run: |
          uv lock --check
          uv run --frozen pytest -q
