name: Внешние ссылки

on:
  schedule:
    - cron: "43 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Проверить HTTP(S)-ссылки
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --timeout 20
            --exclude-mail
            "**/*.md"
          fail: true
